<!DOCTYPE html>
<html lang="km" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>PineAPPleSMS - Offline School Management System</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="shortcut icon" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/icon.png" />

  <!-- Google Fonts Preconnect and Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Moul&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Siemreap&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Moul&display=swap" rel="stylesheet" />

  <!-- Global Error Handler to prevent silent blank screens -->
  <script>
    function renderAppErrorBox(msg) {
      console.error('App Error:', msg);
      if (!document.getElementById('app-error-box') && document.body) {
        var box = document.createElement('div');
        box.id = 'app-error-box';
        box.style = 'position:fixed;inset:0;background:#ffffff;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:sans-serif;';
        box.innerHTML = '<div style="max-width:440px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);text-align:center;">'
          + '<h3 style="font-size:16px;font-weight:700;color:#0f172a;margin-bottom:8px;">PineAPPleSMS Loading Notice</h3>'
          + '<p style="font-size:13px;color:#64748b;margin-bottom:16px;word-break:break-word;">' + (msg || 'Error loading application modules.') + '</p>'
          + '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="width:100%;padding:10px;background:#0f172a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Clear Cache & Refresh</button>'
          + '</div>';
        document.body.appendChild(box);
      }
    }
    window.addEventListener('error', function(e) {
      renderAppErrorBox(e.error?.message || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      renderAppErrorBox(e.reason?.message || String(e.reason));
    });
  </script>

  <!-- Immediate Appearance & Typography Initialization (Prevents FOUT & Theme Flash) -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('school_theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');

        const lang = localStorage.getItem('school_lang') || 'km';
        document.documentElement.lang = lang;

        const enFont = localStorage.getItem('app_font_en') || 'Inter';
        const kmFont = localStorage.getItem('app_font_km') || 'Kantumruy Pro';
        const enStacks = {
          'Inter': "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif",
          'Roboto': "'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif",
          'Plus Jakarta Sans': "'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        };
        const kmStacks = {
          'Kantumruy Pro': "'Kantumruy Pro', 'Khmer OS Siemreap', 'Siemreap', 'Khmer OS', 'Battambang', system-ui, sans-serif",
          'Khmer OS Siemreap': "'Khmer OS Siemreap', 'Siemreap', 'Kantumruy Pro', 'Khmer OS', 'Battambang', system-ui, sans-serif",
          'Khmer OS Moul Light': "'Khmer OS Muol Light', 'Moul', 'Khmer OS Moul Light', 'Kantumruy Pro', cursive, sans-serif",
          "'Khmer OS Muol Light', 'Moul', cursive": "'Khmer OS Muol Light', 'Moul', 'Khmer OS Moul Light', 'Kantumruy Pro', cursive, sans-serif"
        };
        const enStack = enStacks[enFont] || enStacks['Inter'];
        const kmStack = kmStacks[kmFont] || kmStacks['Kantumruy Pro'];
        const root = document.documentElement;
        root.style.setProperty('--font-en', enStack);
        root.style.setProperty('--font-km', kmStack);
        root.style.setProperty('--font-sans', enStack + ', ' + kmStack);
        root.style.setProperty('--font-khmer', kmStack + ', ' + enStack);
        root.setAttribute('data-font-en', enFont);
        root.setAttribute('data-font-km', kmFont);

        // Immediate Font Size Initialization (Prevents Layout Jump / FOUT)
        const fontSizeKey = localStorage.getItem('app_font_size') || 'base';
        const fontSizes = {
          '2xs': { size: '10px', scale: 0.625 },
          'xs': { size: '12px', scale: 0.75 },
          'sm': { size: '14px', scale: 0.875 },
          'base': { size: '16px', scale: 1.0 },
          'lg': { size: '18px', scale: 1.125 },
          'xl': { size: '20px', scale: 1.25 }
        };
        const sizeConfig = fontSizes[fontSizeKey] || fontSizes['base'];
        root.setAttribute('data-font-size', fontSizeKey);
        root.style.fontSize = sizeConfig.size;
        root.style.setProperty('--app-font-size', sizeConfig.size);
        // Immediate Main Button Color & Contrast Initialization (Prevents Visual Flickering)
        const savedMainBtn = localStorage.getItem('main_btn_color') || localStorage.getItem('school_app_primary_color');
        if (savedMainBtn) {
          let cleanHex = savedMainBtn.replace('#', '').trim();
          if (cleanHex.length === 3) {
            cleanHex = cleanHex[0] + cleanHex[0] + cleanHex[1] + cleanHex[1] + cleanHex[2] + cleanHex[2];
          }
          const r = parseInt(cleanHex.substring(0, 2), 16) || 0;
          const g = parseInt(cleanHex.substring(2, 4), 16) || 0;
          const b = parseInt(cleanHex.substring(4, 6), 16) || 0;
          const brightness = (r * 299 + g * 587 + b * 114) / 1000;
          const fg = brightness > 155 ? '#0f172a' : '#ffffff';
          root.style.setProperty('--main-btn-color', savedMainBtn);
          root.style.setProperty('--main-btn-foreground', fg);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN for JIT dynamic classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ["var(--font-en)", "var(--font-km)", "sans-serif"],
            khmer: ["var(--font-km)", "var(--font-en)", "sans-serif"],
            en: ["var(--font-en)", "sans-serif"],
            km: ["var(--font-km)", "sans-serif"],
          },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "var(--main-btn-color, hsl(var(--primary)))",
              foreground: "var(--main-btn-foreground, hsl(var(--primary-foreground)))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
            success: {
              DEFAULT: "hsl(var(--success))",
              foreground: "hsl(var(--success-foreground))",
            },
            warning: {
              DEFAULT: "hsl(var(--warning))",
              foreground: "hsl(var(--warning-foreground))",
            },
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          }
        }
      }
    };
  </script>


  <!-- Standalone Offline Client-side Excel Libraries (SheetJS & ExcelJS) -->
  <script src="assets/vendor/xlsx.full.min.js"></script>
  <script src="assets/vendor/exceljs.min.js"></script>

  <!-- Local fallback / precompiled styles -->
  <link rel="stylesheet" href="css/tailwind.css?v=2.1.6" />
  <link rel="stylesheet" href="css/app.css?v=2.1.6" />
  <link rel="stylesheet" href="css/print.css?v=2.1.6" />
</head>
<body class="h-full bg-background text-foreground antialiased font-khmer">

  <!-- Authenticated Application Shell (hidden until user logs in) -->
  <div id="app" class="hidden flex min-h-screen relative overflow-x-hidden">
    <!-- Sidebar Container (Fixed on Left) -->
    <aside id="sidebar-container" class="fixed top-0 left-0 bottom-0 z-40 h-full w-[16.5rem] sidebar-transition"></aside>

    <!-- Main Content Wrapper (Adjusts margin based on sidebar state) -->
    <div id="main-content-wrapper" class="flex-1 flex flex-col min-w-0 ml-[16.5rem] content-transition">
      <!-- Topbar Container (Sticky Top) -->
      <div id="topbar-container" class="sticky top-0 z-30"></div>

      <!-- Main Page Content Area -->
      <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
        <div id="page-content-container"></div>
      </main>
    </div>
  </div>

  <!-- Login View Container -->
  <div id="login-container"></div>

  <!-- Main JavaScript Module Entrypoint -->
  <script type="module" src="js/app.js?v=2.1.6"></script>
</body>
</html>
